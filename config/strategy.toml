# Strategy profiles. `newsom-mm` is tuned for the Gavin Newsom 2028 Dem-nomination
# market from a live microstructure sample (2026-07-06): price ~0.195, tick 0.001,
# 2-tick spread, thin touch (~$20-250), VERY quiet tape (~0.1 trades/min),
# rewards: min 100 shares/order, 5.5c band, ~$52/day rate, 25% maker-rebate pool.

[profiles.newsom-mm]
# --- fair value ---
micro_levels        = 3
flow_ewma_halflife_s = 120
# --- spread / skew ---
gamma               = 0.6     # inventory skew; sized so full cap leans ~1-2 ticks
delta_min_ticks     = 2       # half-spread floor = 2 ticks (market spread is 2)
c_vol               = 1.5
c_tox               = 3.0
# --- vol horizons ---
vol_short_halflife_s = 10
vol_long_halflife_s  = 900
# --- sizing / inventory ($50 orders, $200 net max position) ---
base_size_usdc      = 100.0   # per token side, split into `layers` orders
q_max_usdc          = 200.0   # NET directional cap (YES minus NO exposure)
q_soft_frac         = 0.6     # stop adding at net $120, exits get urgent
layers              = 2       # 2 x $50 YES orders; NO auto-sizes to reward floor
reward_size_mult    = 1.5     # bump reward-eligible orders to 1.5x the min (100 -> 150 sh)
layer_step_ticks    = 2
# --- placement / churn ---
reprice_ticks       = 2       # ignore 1-tick FV flicker (hold queue position)
resize_frac         = 0.2
min_edge_ticks      = 1       # never bid above FV - 1 tick
# --- regime (damped for a quiet tape: one 250-share print must not flap us) ---
event_cooloff_s     = 30      # shorter: this is a deep, slow market
event_jump_ticks    = 6       # 0.006 = ~3% jump -> pull quotes
event_sweep_mult    = 6.0     # print must be >=6 order-sizes
event_sweep_frac    = 1.0     # AND consume ~all near-touch depth to count as a sweep
trend_flow_z        = 1.8
# --- lifecycle (resolves 2028 — irrelevant here) ---
end_date_taper_days = 7
reduce_only_hours   = 24
halt_before_hours   = 2
# --- exits ---
exit_urgency_s      = 900
merge_min_size      = 20.0


# romania-pm: "Next PM of Romania" — Alexandru Nazare leg. Live sample 2026-07-06:
# price ~0.487/0.488 (near 50/50 -> max reward score, low extremity), tick 0.001,
# 1-tick spread, ~$4k/day tape, rewards: min 50 shares/order, 4.5c band, ~$257/day
# rate, 25% rebate. endDate is stale (past) but still accepting -> handled as no-end.
[profiles.romania-pm]
micro_levels        = 3
flow_ewma_halflife_s = 120
# --- spread / skew ---
gamma               = 0.6
delta_min_ticks     = 1       # tight market (1-tick spread); quote close to score
c_vol               = 1.5
c_tox               = 3.0
# --- vol horizons ---
vol_short_halflife_s = 10
vol_long_halflife_s  = 900
# --- sizing / inventory (MINIMUM reward size — thin/gap-prone book, so a fill
#     must be small & disposable, not a directional bag. Reward < max, on purpose) ---
base_size_usdc      = 22.0    # ~50 sh at these prices = the reward MIN, nothing more
q_max_usdc          = 100.0   # ceiling (min-size orders make accumulation slow anyway)
q_soft_frac         = 0.6
layers              = 1
reward_size_mult    = 1.0     # floor each order to exactly the 50-share reward min
layer_step_ticks    = 2
# --- placement / churn (STICKY: thin/noisy tape must not flap us out of the
#     reward queue; we reprice only on real moves, not microprice jitter) ---
reprice_ticks       = 3       # ignore <=3-tick FV jitter (hold queue position)
resize_frac         = 0.6     # don't cancel/replace on a regime size-flip (154<->77)
min_edge_ticks      = 1
# --- regime: rest through noise (high trend threshold) but pull HARD on a real
#     sweep/jump, since the gapped book makes a toxic fill costly ---
event_cooloff_s     = 30
event_jump_ticks    = 5       # 0.005 jump from a thin book -> pull (gap protection)
event_sweep_mult    = 3.0     # thinner book: a smaller print is a real sweep here
event_sweep_frac    = 0.8     # consuming ~80% of near-touch depth counts
trend_flow_z        = 2.6     # noisy flow z on a $4k/day tape -> raise the bar
trend_vol_ratio     = 5.0     # ~1 trade/hr: microprice jitter must NOT halve size
                          # (real gaps still caught by event_jump_ticks)
# --- lifecycle (end date stale/None -> these are inert; acceptingOrders governs) ---
end_date_taper_days = 7
reduce_only_hours   = 24
halt_before_hours   = 2
# --- exits ---
exit_urgency_s      = 900
merge_min_size      = 20.0


# political-generic：没有专门调参的市场所用的默认兜底 profile
# （`markets-add` 不传 --profile 时用它）。刻意保守 —— 微结构未知，
# 所以下单额度小、敞口上限紧。
#
# TICK 量纲警告（对这里所有 profile 都成立）：所有 `*_ticks` 参数都是
# “个数 × tick_size”，同一组数字在不同市场上代表的金额完全不同。下面这套
# 按 0.01（1 美分）tick 设定 —— 政治类市场最常见的情况。放到 0.001 tick 的
# 市场上会紧 10 倍，放到 0.1 tick 的市场上会宽 10 倍。换市场前务必核对
# `markets.csv` 里的 tick / spread / best_bid / volume_24h；跑通之后，像
# newsom-mm / romania-pm 那样给该市场单独建一个 profile。
[profiles.political-generic]
micro_levels        = 3
flow_ewma_halflife_s = 120
# --- 价差 / 库存倾斜 ---
gamma               = 0.5
delta_min_ticks     = 1       # 半价差下限 1 个 tick：贴住盘口
c_vol               = 1.2
c_tox               = 2.0
# --- 波动窗口 ---
vol_short_halflife_s = 10
vol_long_halflife_s  = 900
# --- sizing / 库存（保守：毒性未知 -> 额度小、上限紧） ---
base_size_usdc      = 25.0
q_max_usdc          = 100.0   # 净方向敞口上限
q_soft_frac         = 0.6
layers              = 1
reward_size_mult    = 1.0     # 正好等于奖励最小量，不加余量
layer_step_ticks    = 1
# --- 挂单 / 防抖动 ---
reprice_ticks       = 1       # FV 动 1 个 tick 就改价
resize_frac         = 0.2
min_edge_ticks      = 1       # 报价不得高于 FV - 1 tick
# --- 状态机（先取库内默认值；拿到实盘样本后再收紧） ---
event_cooloff_s     = 60
event_jump_ticks    = 2       # 1 美分 tick 的市场上 = 2 美分跳变
event_sweep_levels  = 3
event_sweep_mult    = 4.0
event_sweep_frac    = 0.8
trend_flow_z        = 1.5
trend_vol_ratio     = 2.0
# --- 生命周期 ---
end_date_taper_days = 7
reduce_only_hours   = 24      # 进入这个区间引擎就转 REDUCE_ONLY
halt_before_hours   = 2       # ...再往里就是 HALTED
# --- 退出 ---
exit_urgency_s      = 900
merge_min_size      = 20.0


# fed-sept-mm：「Will there be no change in Fed interest rates after the
# September 2026 meeting?」—— 2026-09-04 从 markets.csv 采样：
#   mid 0.595 / tick 0.01 / spread 0.01（1 tick，1 美分市场能有的最紧价差）
#   neg_risk = 1，orderMinSize = 5 股，taker 费率 5%（最高档），rebate 25%
#   rewards_max_spread = 4.5c（= 4.5 tick，是自然价差的 4.5 倍，带宽极宽松）
#   rewardsMinSize = 200 股（2026-09-04 从网页确认；markets.csv 没有这一列）
#   liquidity $267k、volume_24h $1.92M
#   reward pool $1000/天、rebate pool ≈ $9716/天（都是榜首，第二名差两个数量级）
#   end_date 2026-09-16T00:00:00Z（采样时约剩 11.8 天）
#
# 原型与 newsom-mm / romania-pm 完全相反：那两个是「薄 + 安静」，只能挂奖励
# 最小量；这个是「深 + 忙 + 接近 50/50」，正好是 TIPS.md 第 1 条的反面 ——
# 「Big size only belongs on deep books you can offload into」，所以敢放大尺寸。
#
# 但要害是：taker 费率 5% 是最高档，意味着吃单成本约 2% 名义。愿意付这个钱
# 来吃单的人大概率带信息，所以这里的**主要风险是逆向选择**，不是流动性。
# 参数按「贴住盘口去挣那 $9716/天的返佣池 + 一有毒性迹象就拉开」来定，
# 而不是按 political-generic 那种「躺平吃奖励」的保守姿势来定。
#
# TICK 量纲：以下 *_ticks 全部按 tick = 0.01（1 美分）计，与 political-generic
# 一致。放到 0.001 tick 的市场上会紧 10 倍。
[profiles.fed-sept-mm]
micro_levels        = 3
flow_ewma_halflife_s = 90      # 忙市场：流量信号 90s 半衰期，比 120 稍快一点
# --- 价差 / 库存倾斜 ---
gamma               = 0.6
delta_min_ticks     = 1        # 半价差 1 tick = 1c。自然价差本来就只有 1 tick，
                               # 再宽就永远排在队列后面一笔都吃不到 —— 而这市场
                               # 的大头（$9716/天）是返佣，返佣只有成交才有
c_vol               = 0
c_tox               = 3.0      # 关键项：5% taker 费率 -> 毒性填充代价最高，
                               # 一旦 markout 转差就把价差拉开（比 generic 的 2.0 高）
# --- 波动窗口 ---
vol_short_halflife_s = 10
vol_long_halflife_s  = 900
# --- 尺寸 / 库存 ---
base_size_usdc      = 150.0    # 每边 $150 的预算，但 equal_share_entries 会把两边统一到
                               # 同一个股数 = min(150/0.46, 150/0.51) ≈ 294 股。
                               # 实际挂出 YES 294($135) + NO 294($150) ≈ $285。
                               # 约束是「统一后的股数 >= rewardsMinSize(200)」：
                               #   base >= 200 × 贵那边的挂单价 = 200 × 0.51 = $102 ✓
                               # ⚠️ 中价跌破 0.5 后「贵的那边」换成了 NO；再往下走
                               # （比如到 0.30，NO 挂 0.69）就要 base >= $138，需重算。
                               # ⚠️ $285 挂单 + max_market_notional_usdc=400 的硬顶，
                               # 只剩 ~$115 给库存，偏紧 —— 注意别同时再开别的市场。
q_max_usdc          = 200.0    # 净方向敞口上限。别顶满 config.toml 的
                               # max_market_notional_usdc = 400（那是市场硬顶）
q_soft_frac         = 0.5      # 净敞口到 $100 就停止加仓那一侧
layers              = 1        # 必须是 1，理由见文件末尾「layers 警告」
reward_size_mult    = 1.0      # 不加余量：股数已经够，别再放大名义
layer_step_ticks    = 1
# --- 挂单 / 防抖动 ---
reprice_ticks       = 1        # 1c 容差。1 美分 tick 的市场上 2c 就是一整个价差，
                               # 再宽等于拿过期报价去撞行情
resize_frac         = 0.3      # 比 generic 的 0.2 稍粘，但仍允许真实尺寸调整
# ★ 贴盘口（本 profile 的核心改动，两个参数必须成对开）
#   这个市场价差只有 1 个 tick，而 delta 有 1 tick 的硬下限，导致目标价永远
#   够不到买一，只能挂买二。开 join_touch_ticks=1 才能挂到买一。
#   min_edge_ticks 必须为 0：买一距 FV 只有 0.5 tick，整 tick 粒度的
#   min_edge=1 会把它挡掉，开关就白开了（有单测锁定这个行为）。
#
#   实测对比（中价 0.475、买一 0.47/0.52、base=150、两边各 288~294 股）：
#                挂单价        每对锁定   奖励分 S    挂出总额
#     买一      0.47/0.52      1.0c      0.790      $285.58
#     买二      0.46/0.51      3.0c      0.444      $285.30
#
#   ⚠️ 注意别搞反：贴到买一之后，**每对赚的价差从 3c 降到 1c**（每边 edge
#   从 1.5c 降到 0.5c），单笔成交是更差的。收益来自另外两头：
#     ① 成交频率大幅提高 -> 返佣池 $9522/天是按 maker 成交份额分的，
#        是奖励池($1000/天)的 9.5 倍，必须靠成交量拿；
#     ② 奖励分 0.444 -> 0.790（+78%），因为 S=((4.5-s)/4.5)^2 是二次衰减。
#   如果哪天返佣池塌了或毒性太高，把 join_touch_ticks 改回 0 就退回买二。
#
#   安全边界仍在：delta >= 1 tick、只挂在 best_bid、post_only、以及 c_tox=3.0
#   （markout 转差会把 delta 拉宽，自动把我们拽回盘口后面）。
join_touch_ticks    = 1
min_edge_ticks      = 0
equal_share_entries = true     # 两边同一个股数：奖励分取 min(Q_one,Q_two)、
                               # 合并也只合 min(yes,no)，股数相等才不浪费、不留残差
# --- 状态机 ---
event_cooloff_s     = 45
event_jump_ticks    = 3        # 3c ≈ 5% 价格跳变才撤。1 美分 tick 上 2c 太容易误触，
                               # 误触一次就是 45s 冷却、奖励归零
event_sweep_levels  = 3
event_sweep_mult    = 4.0
event_sweep_frac    = 0.8
trend_flow_z        = 2.5      # 从 1.5 提上来：$1.9M/天的市场 flow z 常态就偏高
trend_vol_ratio     = 4.0      # 从 2.0 提上来 —— 这是治「假 TRENDING 抖动」的主药，
                               # 见 TIPS.md 第 3 条：vol 比值抖动会让尺寸反复腰斩，
                               # 每次腰斩都是一轮 cancel=2/place=2，白丢队列位置
# --- 生命周期 ---
# 注意：end_date_taper_days 目前是死参数（src/ 里没有任何地方读它），
# 真正生效的是下面两个。
reduce_only_hours   = 36       # 决议前 36h 转 REDUCE_ONLY（只减不加）
halt_before_hours   = 6        # 决议前 6h 彻底停。⚠️ 采样时 end_date 是
                               # 2026-09-16T00:00Z，很可能是「09-15 18:00Z 声明
                               # + 6h 缓冲」，所以 6h 正好落在声明那一刻。
                               # 但 FOMC 真实公布时点务必自己核对一次
# --- 退出 ---
exit_urgency_s      = 600      # 比 generic 的 900 急：只剩 12 天且事件驱动，别硬扛
merge_min_size      = 20.0
#
# ── 备注 1：layers 必须是 1 ────────────────────────────────────────────────
# quoting._add_layers 会把「每层」股数上调到 reward_floor：
#     if 0.5*reward_floor <= per < reward_floor: per = reward_floor
# per 是每层的量，所以 layers=2 且每层都够不上 floor 时，总名义可能翻到 2 倍。
# 例：base $120 -> YES 205 股，若开 2 层则每层 102 股，落在
# [0.5*200, 200) = [100, 200) 区间 -> 每层被顶到 200 -> 总计 400 股 ≈ $234，
# 是计划名义的 2 倍。layers=1 时 per = total_size，只在股数不够时才顶到 floor。
#
# ── 备注 2：rewardsMinSize 与 orderMinSize 是两回事，别搞混 ─────────────────
#   orderMinSize   = 5   -> markets.csv 的 min_size 列，交易所允许的最小下单股数。
#                          代码里是 _add_layers(exchange_min=...)，低于它就不下单。
#   rewardsMinSize = 200 -> 拿到流动性奖励所需的最小股数（本市场，网页确认）。
#                          代码里是 reward_floor = rewardsMinSize × reward_size_mult
#                          （quoting.py:77）。低于它奖励直接归零。
# markets.csv 只有前一列，没有后一列 —— 这是个真缺口，每次换市场都要去网页查。
# TIPS.md 第 2 条还说这个值会变（见过 50 -> 100），所以定期复核。
#
# ── 备注 3：等额美元 -> 份额不等 -> 合并后残差 ~91 股 ────────────────────────
# 205 股 YES + 296 股 NO，_maybe_merge 只合 min() = 205 对，剩下 91 股 NO
# （≈ $37 方向敞口，等价于净空 91 股 YES）。而且当前 signature_type=3 且 .env
# 若没有 POLY_BUILDER_*，merge 是静默失效的（merge.py:97-110），残差只能靠
# _maybe_exit 的卖单或扛到结算。三条路：补 builder creds / 接受并靠 skew+exit /
# 改 quoting 让两边按同一股数下单。


# brazil-senate-thin：「Will Marília Campos win the most votes in the 2026 Minas Gerais
# Senate election?」—— 2026-09-04 从 markets.csv 采样 + 实盘第一段日志：
#   mid 0.59 / tick 0.01 / spread 0.02（2 tick）
#   neg_risk = 1，orderMinSize = 5 股，taker 费率 4%，rebate 25%
#   rewards_max_spread = 5.5c（宽松）
#   rewardsMinSize = 20 股（2026-09-05 网页确认；markets.csv 现在有这一列了）
#   liquidity $3,576、volume_24h **$79**（一天几十美元，基本是死市）
#   reward pool $116/天、rebate pool **$0.32/天**（返佣可以忽略）
#   end_date 2026-10-04T06:00:00Z（采样时约剩 30 天）
#
# 原型：薄 + 死寂。和 fed-sept-mm 完全相反。TIPS.md 第 1 条的原话就是为这种
# 市场写的：「On thin/manipulable markets, rest the *minimum* reward-qualifying
# size... A fill should be small and disposable.」
#
# 收入结构决定了姿势：rebate $0.32/天 ≈ 0，所以**全部收入就是那 $116/天的
# 奖励**。奖励只要求「挂在带内 + 够最小量」，不要求成交。于是最优解是
# 「挂得够宽、尽量别成交、千万别 churn」—— 成交了反而要承担一个出不掉的
# 方向仓（TIPS「Getting out」那节：159 股 Romania 平仓吃了 2 个 tick 滑点）。
#
# 2026-09-04 实盘暴露的头号问题就是 churn：`trend_vol_ratio=2.0` 在这种
# 一天 $79 的市场上被 microprice jitter 顶爆 -> 假 TRENDING -> 尺寸腰斩 ->
# 每 13~25 秒一轮 cancel=2/place=2，白丢队列位置。本 profile 主要是治这个。
[profiles.brazil-senate-thin]
micro_levels        = 3
flow_ewma_halflife_s = 120     # 死市，流量信号几乎没有，用默认值即可
# --- 价差 / 库存倾斜 ---
gamma               = 0.5
delta_min_ticks     = 1        # 半价差 2c = 正好一个自然价差。挂出总宽度 4c，
                               # 仍在 5.5c 奖励带内，但排在盘口后一格 ——
                               # 死市里"别成交"比"抢成交"更值钱
c_vol               = 1.0
c_tox               = 2.5      # 平时 tox=0，但薄书上一旦被砸就是真毒性
# --- 波动窗口 ---
vol_short_halflife_s = 10
vol_long_halflife_s  = 900
# --- 尺寸 / 库存 ---
base_size_usdc      = 25.0     # 每边 $25：@0.57 ≈ 44 股，@0.39 ≈ 64 股。
                               # rewardsMinSize = 20，两边都远超（44 / 64），够格拿奖励。
                               # 反算公式：base = rewardsMinSize × 贵那边的价 = 20 × 0.57 ≈ $11.4
                               # 现在挂 $25 是 2 倍最小量 —— TIPS 第 1 条说薄市场该挂
                               # 「最小奖励量」，但 $11 的单子连 5 股的最小下单量都快
                               # 贴上了、且 $116/天的池子按份额分，所以留了点余量。
                               # 若要更保守就改 12.0（YES 21 股 / NO 31 股）
q_max_usdc          = 100.0    # 净方向敞口上限：死市平不掉仓，敞口要压小
q_soft_frac         = 0.6
layers              = 1        # 必须是 1，理由见 fed-sept-mm 备注 1
reward_size_mult    = 1.0
layer_step_ticks    = 1
# --- 挂单 / 防抖动（本 profile 的重点）---
reprice_ticks       = 2        # 2c 容差：死市里 FV 抖 1c 就改价纯属自残，
                               # 见 TIPS.md 第 4 条「Make it sticky」
resize_frac         = 0.6      # 吸收 TRENDING 的尺寸腰斩（配合下面的阈值）
min_edge_ticks      = 0
join_touch_ticks    = 1
equal_share_entries = true
# --- 状态机 ---
event_cooloff_s     = 45
event_jump_ticks    = 4        # 4c 才撤：自然价差就有 2c，2c 阈值会天天误触，
                               # 一次误触就是 45s 冷却、奖励归零
event_sweep_levels  = 3
event_sweep_mult    = 3.0      # 薄书：小单就算扫单
event_sweep_frac    = 0.8
trend_flow_z        = 2.5      # 几乎没成交，flow z 常态为 0，阈值高也无所谓
